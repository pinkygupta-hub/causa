# Quarkus configuration
# Environment variable: QUARKUS_HTTP_PORT
quarkus.http.port=${QUARKUS_HTTP_PORT:9090}

# Ollama configuration
# Environment variable: OLLAMA_BASE_URL
# Examples: http://ollama.default.svc.cluster.local:11434 (cluster) or http://localhost:9034 (local)
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://ollama.default.svc.cluster.local:11434}

# Disable Quarkus Dev Services for Ollama (use port-forwarded service instead)
# Environment variable: OLLAMA_DEVSERVICES_ENABLED
quarkus.langchain4j.ollama.devservices.enabled=${OLLAMA_DEVSERVICES_ENABLED:false}

# Detector model configuration
# Environment variable: OLLAMA_DETECTOR_MODEL
quarkus.langchain4j.ollama.detector.chat-model.model-id=${OLLAMA_DETECTOR_MODEL:llama2:7b-chat-q8_0}
quarkus.langchain4j.ollama.detector.base-url=${quarkus.langchain4j.ollama.base-url}
# Environment variable: OLLAMA_DETECTOR_TIMEOUT
quarkus.langchain4j.ollama.detector.timeout=${OLLAMA_DETECTOR_TIMEOUT:300s}

# RCA model configuration
# Environment variable: OLLAMA_RCA_MODEL
quarkus.langchain4j.ollama.rca.chat-model.model-id=${OLLAMA_RCA_MODEL:llama2:7b-chat-q8_0}
quarkus.langchain4j.ollama.rca.base-url=${quarkus.langchain4j.ollama.base-url}
# Environment variable: OLLAMA_RCA_TIMEOUT
quarkus.langchain4j.ollama.rca.timeout=${OLLAMA_RCA_TIMEOUT:300s}

# Validator model configuration
# Environment variable: OLLAMA_VALIDATOR_MODEL
quarkus.langchain4j.ollama.validator.chat-model.model-id=${OLLAMA_VALIDATOR_MODEL:llama2:7b-chat-q8_0}
quarkus.langchain4j.ollama.validator.base-url=${quarkus.langchain4j.ollama.base-url}
# Environment variable: OLLAMA_VALIDATOR_TIMEOUT
quarkus.langchain4j.ollama.validator.timeout=${OLLAMA_VALIDATOR_TIMEOUT:300s}

# Embedding model
# Environment variable: OLLAMA_EMBEDDING_MODEL
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:llama2:7b-chat-q8_0}

# Ollama global timeout
# Environment variable: OLLAMA_TIMEOUT
quarkus.langchain4j.ollama.timeout=${OLLAMA_TIMEOUT:300s}

# Prometheus configuration
# Environment variable: PROMETHEUS_URL
# Examples: http://prometheus-k8s.monitoring.svc.cluster.local:9090 (cluster) or http://localhost:9035 (local)
prometheus.url=${PROMETHEUS_URL:http://prometheus-k8s.monitoring.svc.cluster.local:9090}

# Cryostat configuration
# Environment variable: CRYOSTAT_URL
# Example: https://cryostat.openshift-operators.svc.cluster.local:4180
cryostat.url=${CRYOSTAT_URL:https://cryostat.openshift-operators.svc.cluster.local:4180}
# Environment variable: CRYOSTAT_ENABLED
cryostat.enabled=${CRYOSTAT_ENABLED:false}

# Rest client configuration
quarkus.rest-client.prometheus-api.url=${prometheus.url}
quarkus.rest-client.cryostat-api.url=${cryostat.url}

# TLS Configuration
# Environment variable: QUARKUS_TLS_TRUST_ALL
quarkus.tls.trust-all=${QUARKUS_TLS_TRUST_ALL:true}

# RAG configuration
# Environment variable: RAG_ENABLED
rag.enabled=${RAG_ENABLED:true}
# Environment variable: RAG_KNOWLEDGE_BASE_PATH
rag.knowledge-base.path=${RAG_KNOWLEDGE_BASE_PATH:knowledge_base/}

# RCA Scan configuration
# Environment variable: RCA_SCAN_INTERVAL
rca.scan.interval=${RCA_SCAN_INTERVAL:5m}
# Environment variable: RCA_LABEL
rca.label=${RCA_LABEL:kruize/rca=enabled}

# RCA Mode configuration
# Supported modes: MONITORING (scheduled scanning), ALERT_DRIVEN (trigger-based via alerts)
# Environment variable: RCA_MODE
rca.mode=${RCA_MODE:ALERT_DRIVEN}

# MongoDB Configuration
# Environment variable: MONGODB_CONNECTION_STRING
# Examples: mongodb://mongodb.default.svc.cluster.local:27017 (cluster) or mongodb://localhost:9017?retryWrites=false (local)
quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb.default.svc.cluster.local:27017?retryWrites=false}
# Environment variable: MONGODB_DATABASE
quarkus.mongodb.database=${MONGODB_DATABASE:causa_rca}
# Environment variable: MONGODB_USER
quarkus.mongodb.credentials.username=${MONGODB_USER:admin}
# Environment variable: MONGODB_PASSWORD
quarkus.mongodb.credentials.password=${MONGODB_PASSWORD:password}
# Environment variable: MONGODB_AUTH_SOURCE
quarkus.mongodb.credentials.auth-source=${MONGODB_AUTH_SOURCE:admin}

# Dashboard Configuration
# Environment variable: RCA_DASHBOARD_SHOW_PROPOSED_SOLUTION
rca.dashboard.show-proposed-solution=${RCA_DASHBOARD_SHOW_PROPOSED_SOLUTION:false}
# Environment variable: RCA_DASHBOARD_PAGE_SIZE
rca.dashboard.page-size=${RCA_DASHBOARD_PAGE_SIZE:50}

# Cleanup Configuration
# Environment variable: RCA_CLEANUP_ENABLED
rca.cleanup.enabled=${RCA_CLEANUP_ENABLED:true}
# Environment variable: RCA_CLEANUP_RETENTION_DAYS
rca.cleanup.retention-days=${RCA_CLEANUP_RETENTION_DAYS:30}
# Environment variable: RCA_CLEANUP_SCHEDULE (cron expression)
rca.cleanup.schedule=${RCA_CLEANUP_SCHEDULE:0 0 2 * * ?}
