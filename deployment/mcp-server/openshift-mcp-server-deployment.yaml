---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-server
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-server
rules:
  # Pod operations
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod status
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Namespaces (for listing)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-server
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: default
  labels:
    app: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      containers:
        - name: mcp-server
          image: node:20-slim
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              # Use npx to run the server with streamable HTTP and SSE support
              # The --port flag enables both streamable HTTP and SSE transports
              npx -y kubernetes-mcp-server --port 3000
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: "kubernetes.default.svc"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  namespace: default
  labels:
    app: kubernetes-mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: kubernetes-mcp-server
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kubernetes-mcp-server
  namespace: default
  labels:
    app: kubernetes-mcp-server
  annotations:
    # Disable HAProxy timeout for long-lived MCP streaming connections
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: kubernetes-mcp-server
  port:
    targetPort: http
  tls:
    termination: edge
    # Allow plain HTTP as well as HTTPS so that in-cluster clients using http://
    # and external clients using https:// both work without redirect loops.
    # The quarkus-langchain4j-mcp client does NOT follow 302 redirects, so
    # "Redirect" would cause every MCP call to fail with "Unexpected status code: 302".
    insecureEdgeTerminationPolicy: Allow
