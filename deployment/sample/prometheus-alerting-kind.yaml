---
# PrometheusRule for memory alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: causa-memory-alerts
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
  - name: causa-memory-alerts
    interval: 30s
    rules:
    - alert: causa-high-memory
      expr: |
        (
          container_memory_working_set_bytes{container!="", container!="POD"}
          /
          container_spec_memory_limit_bytes{container!="", container!="POD"}
        ) * 100 > 80
      labels:
        severity: critical
        alertname: causa-high-memory
      annotations:
        summary: "High memory usage detected in {{ $labels.namespace }}/{{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }} of its memory limit."
        namespace: "{{ $labels.namespace }}"
        pod: "{{ $labels.pod }}"

---
# Alertmanager configuration with webhook for critical alerts
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info
    - equal:
      - namespace
      source_matchers:
      - alertname = InfoInhibitor
      target_matchers:
      - severity = info

    receivers:
    - name: Default
    - name: Watchdog
    - name: Critical
      webhook_configs:
      - url: 'http://rca-agent.default.svc.cluster.local:9090/rca/webhook'
        send_resolved: false
        http_config:
          follow_redirects: true
    - name: "null"

    route:
      group_by:
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: Default
      repeat_interval: 12h
      routes:
      - matchers:
        - alertname = Watchdog
        receiver: Watchdog
      - matchers:
        - alertname = InfoInhibitor
        receiver: "null"
      - matchers:
        - alertname =~ causa-.*
        receiver: Critical
        group_wait: 5s
        group_interval: 5s
      - matchers:
        - severity = critical
        receiver: Default
        group_wait: 30s
        group_interval: 5m
