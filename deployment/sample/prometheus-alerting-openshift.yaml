---
# PrometheusRule for memory alerts - OpenShift Configuration
# Deploy to openshift-monitoring namespace for monitoring integration
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: causa-memory-alerts
  namespace: openshift-monitoring
  labels:
    prometheus: k8s
    role: alert-rules
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
  - name: causa-memory-alerts
    interval: 30s
    rules:
    - alert: causa-high-memory
      expr: |
        (
          container_memory_working_set_bytes{
            namespace="default",
            pod=~"heap-oom-.*",
            container!="",
            container!="POD"
          }
          /
          container_spec_memory_limit_bytes{
            namespace="default",
            pod=~"heap-oom-.*",
            container!="",
            container!="POD"
          }
        )
        * 100 > 80
      labels:
        severity: critical
        alertname: causa-high-memory
      annotations:
        summary: "High memory usage detected in {{ $labels.namespace }}/{{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }} of its memory limit."
        namespace: "{{ $labels.namespace }}"
        pod: "{{ $labels.pod }}"

---
# Secret to update Alertmanager configuration with webhook
# Apply this to update the main Alertmanager configuration
# Command: oc create secret generic alertmanager-main --from-file=alertmanager.yaml=<this-file> --dry-run=client -o yaml | oc apply -n openshift-monitoring -f -
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      http_config:
        proxy_from_environment: true
      resolve_timeout: 5m

    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info

    receivers:
    - name: Default
    - name: Watchdog
    - name: Critical
      webhook_configs:
      - url: 'http://rca-agent.default.svc.cluster.local:9090/rca/webhook'
        send_resolved: false
        http_config:
          follow_redirects: true

    route:
      group_by:
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: Default
      repeat_interval: 12h
      routes:
      - matchers:
        - alertname = Watchdog
        receiver: Watchdog
      - matchers:
        - alertname =~ causa-.*
        receiver: Critical
        group_wait: 5s
        group_interval: 5s
      - matchers:
        - severity = critical
        receiver: Critical
        group_wait: 30s
        group_interval: 5m

---
# NetworkPolicy to allow RCA agent to access user workload monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rca-to-thanos-querier
  namespace: openshift-user-workload-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 9091

---
# RoleBinding to allow RCA agent to view monitoring resources
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-monitoring-view
  namespace: openshift-monitoring
subjects:
- kind: ServiceAccount
  name: rca-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io

---
# Additional RoleBinding for user workload monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-uwm-view
  namespace: openshift-user-workload-monitoring
subjects:
- kind: ServiceAccount
  name: rca-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
