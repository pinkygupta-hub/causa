---
# PrometheusRule for memory alerts - OpenShift Configuration
# Deploy to openshift-tuning namespace for monitoring integration
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: causa-memory-alerts
  namespace: openshift-tuning
  labels:
    prometheus: k8s
    role: alert-rules
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
  - name: causa-memory-alerts
    interval: 30s
    rules:
    - alert: causa-high-memory
      expr: |
        (
          container_memory_working_set_bytes{container!="", container!="POD"}
          /
          container_spec_memory_limit_bytes{container!="", container!="POD"}
        ) * 100 > 95
      labels:
        severity: critical
        alertname: causa-high-memory
      annotations:
        summary: "High memory usage detected in {{ $labels.namespace }}/{{ $labels.pod }}"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }} of its memory limit."
        namespace: "{{ $labels.namespace }}"
        pod: "{{ $labels.pod }}"

---
# AlertmanagerConfig for OpenShift User Workload Monitoring
# This integrates with OpenShift's built-in Alertmanager
apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: causa-alertmanager-config
  namespace: openshift-tuning
spec:
  route:
    groupBy:
    - namespace
    groupWait: 5s
    groupInterval: 5s
    repeatInterval: 12h
    receiver: causa-webhook
    matchers:
    - name: alertname
      matchType: =~
      value: causa-.*
  
  receivers:
  - name: causa-webhook
    webhookConfigs:
    - url: 'http://rca-agent.default.svc.cluster.local:9090/rca/webhook'
      sendResolved: false
      httpConfig:
        followRedirects: true

---
# NetworkPolicy to allow RCA agent in default namespace to access Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rca-to-prometheus
  namespace: openshift-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 9091

---
# NetworkPolicy to allow RCA agent to access user workload monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rca-to-thanos-querier
  namespace: openshift-user-workload-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 9091

---
# RoleBinding to allow RCA agent to view monitoring resources
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-monitoring-view
  namespace: openshift-tuning
subjects:
- kind: ServiceAccount
  name: rca-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io

---
# Additional RoleBinding for user workload monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-uwm-view
  namespace: openshift-user-workload-monitoring
subjects:
- kind: ServiceAccount
  name: rca-agent-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io

